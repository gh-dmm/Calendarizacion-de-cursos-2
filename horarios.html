<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reporte General - Grupos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f1f3f4; font-family: 'Roboto', sans-serif; }
        .container { background: white; margin-top: 30px; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .table thead { background: #4285F4; color: white; }
        .btn-delete { color: #EA4335; cursor: pointer; font-weight: bold; }
        .btn-delete:hover { color: #b71c1c; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="m-0">📋 Control de Grupos y Horarios</h2>
            <button class="btn btn-outline-secondary" onclick="window.close()">Cerrar</button>
        </div>
        
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>ID Curso</th>
                        <th>Aula</th>
                        <th>Alumnos</th>
                        <th>Horario</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaData"></tbody>
            </table>
        </div>
        <div id="vacio" class="text-center text-muted py-4 d-none">No hay cursos registrados.</div>
    </div>

    <script>
        function renderizarTabla() {
            const cursos = JSON.parse(localStorage.getItem('cursos')) || [];
            const tabla = document.getElementById('tablaData');
            const mensajeVacio = document.getElementById('vacio');

            if (cursos.length === 0) {
                tabla.innerHTML = "";
                mensajeVacio.classList.remove('d-none');
                return;
            }

            mensajeVacio.classList.add('d-none');
            tabla.innerHTML = cursos.map(c => `
                <tr>
                    <td><strong>#${c.id}</strong></td>
                    <td><span class="badge bg-primary px-3">Aula ${c.aulaId}</span></td>
                    <td>${c.alumnos} pers.</td>
                    <td><code>${c.inicio}:00 - ${c.fin}:00</code></td>
                    <td>
                        <button class="btn btn-sm btn-outline-danger" onclick="borrarDesdeAqui(${c.id})">
                            Eliminar
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Función puente para conectar con la lógica de eliminación
        function borrarDesdeAqui(id) {
            if (confirm("¿Eliminar este curso?")) {
                let cursos = JSON.parse(localStorage.getItem('cursos')) || [];
                cursos = cursos.filter(c => c.id !== id);
                localStorage.setItem('cursos', JSON.stringify(cursos));
                renderizarTabla(); // Actualiza la vista inmediatamente
            }
        }

        // Carga inicial
        renderizarTabla();
    </script>
</body>
</html>
