<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Horarios Finales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container bg-white p-4 shadow rounded">
        <h2>Reporte de Grupos y Horarios</h2>
        <table class="table mt-4">
            <thead class="table-dark"><tr><th>ID</th><th>Aula</th><th>Alumnos</th><th>Horario</th></tr></thead>
            <tbody id="tabla"></tbody>
        </table>
    </div>
    <script>
        const cursos = JSON.parse(localStorage.getItem('cursos')) || [];
        document.getElementById('tabla').innerHTML = cursos.map(c => 
            `<tr><td>${c.id}</td><td>Aula ${c.aulaId}</td><td>${c.alumnos}</td><td>${c.inicio}:00 - ${c.fin}:00</td></tr>`
        ).join('') || '<tr><td colspan="4" class="text-center">No hay datos.</td></tr>';
    </script>
</body>
</html>
